<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: Browser — Rounded square tile, white/silver, embossed globe/compass -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="40%" style="stop-color:#8896A4"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="metal-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1.5" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1.2" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" 
        stroke="#C8D0D8" stroke-width="1.5"/>
  
  <!-- Globe (browser symbol) — embossed metallic -->
  <g filter="url(#emboss)">
    <!-- Outer circle -->
    <circle cx="64" cy="64" r="34" fill="none" stroke="url(#metal)" stroke-width="5"/>
    
    <!-- Latitude lines -->
    <ellipse cx="64" cy="64" rx="34" ry="14" fill="none" stroke="url(#metal)" stroke-width="2.5"/>
    <ellipse cx="64" cy="64" rx="34" ry="28" fill="none" stroke="url(#metal)" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Longitude lines -->
    <ellipse cx="64" cy="64" rx="14" ry="34" fill="none" stroke="url(#metal)" stroke-width="2.5"/>
    <ellipse cx="64" cy="64" rx="28" ry="34" fill="none" stroke="url(#metal)" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Horizontal equator -->
    <line x1="30" y1="64" x2="98" y2="64" stroke="url(#metal)" stroke-width="2.5"/>
    
    <!-- Vertical meridian -->
    <line x1="64" y1="30" x2="64" y2="98" stroke="url(#metal)" stroke-width="2.5"/>
    
    <!-- Compass point (navigation arrow) -->
    <polygon points="64,36 60,48 64,44 68,48" fill="url(#metal-light)" stroke="#7A8A98" stroke-width="0.8"/>
  </g>
</svg>
